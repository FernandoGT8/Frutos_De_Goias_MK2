<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeamento da Fruticultura em Goiás</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="titulo-mapa">
        Mapeamento da Fruticultura em Goiás
    </div>

    <!-- Janela de Filtro de Frutas (Estilo Painel Flutuante) -->
    <div id="filtro-frutas-card">
        <h5 style="margin:0 0 8px 0; font-size: 15px; font-weight: bold;">Filtrar Frutas</h5>
        <div id="lista-checkboxes"></div>
        <button id="btn-toggle-all" class="btn btn-sm btn-outline-secondary w-100 mt-2">✅ Marcar / ❌ Desmarcar Todas</button>
    </div>

    <!-- Card de Ranking -->
    <div id="ranking-card">
        <h4 style="margin:0 0 8px 0;">Ranking Top 10</h4>
        <div id="ranking-subtitle">Carregando...</div>
        <div id="ranking-chart"></div>
    </div>

    <div class="folium-map" id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
